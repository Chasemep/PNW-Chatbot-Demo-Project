services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: purdue_policy_chatbot
      POSTGRES_USER: purdue
      POSTGRES_PASSWORD: purdue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U purdue -d purdue_policy_chatbot",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://purdue:purdue@postgres:5432/purdue_policy_chatbot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:

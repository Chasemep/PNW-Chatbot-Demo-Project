<!doctype html>
<html lang="en">
  <head>
    <title>Academic Calendar</title>
  </head>
  <body>
    <main>
      <h1>Academic Calendar</h1>
      <p>The calendar lists important student deadlines.</p>
      <h2>Registration</h2>
      <ol>
        <li>Review course availability.</li>
        <li>Submit registration before the deadline.</li>
      </ol>
      <table>
        <caption>Registration deadlines</caption>
        <thead>
          <tr><th>Term</th><th>Deadline</th></tr>
        </thead>
        <tbody>
          <tr><td>Fall</td><td>August 20</td></tr>
        </tbody>
      </table>
      <aside class="sidebar">
        <h2>Need help?</h2>
        <p>Contact the Registrar.</p>
      </aside>
      <div class="callout">
        <strong>Important:</strong> Deadlines are subject to change.
      </div>
    </main>
  </body>
</html>
